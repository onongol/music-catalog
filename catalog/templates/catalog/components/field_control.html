{% if field.field.widget.input_type == "select" %}
    <select class="rounded-lg border bg-white px-3 py-2 text-sm text-slate-900 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400/40 dark:bg-slate-900 dark:text-slate-100 {% if field.errors %}border-red-500{% else %}border-slate-300 dark:border-slate-600{% endif %} {{ extra }}"
            name="{{ field.html_name }}"
            id="{{ field.auto_id }}"
            {% if field.errors %}aria-invalid="true"{% endif %}
            {% if field.aria_describedby %}aria-describedby="{{ field.aria_describedby }}"{% endif %}
            {% if field.field.required %}required{% endif %}>
        {% for value, label in field.field.choices %}
            <option value="{{ value }}"
                    {% if value|stringformat:"s" == field.value|default_if_none:""|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
{% else %}
    <input class="rounded-lg border bg-white px-3 py-2 text-sm text-slate-900 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400/40 dark:bg-slate-900 dark:text-slate-100 {% if field.errors %}border-red-500{% else %}border-slate-300 dark:border-slate-600{% endif %} {{ extra }}" type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.auto_id }}" {% if field.errors %}aria-invalid="true"{% endif %} {% if field.aria_describedby %}aria-describedby="{{ field.aria_describedby }}"{% endif %} {% if field.value != None and field.value != "" %}value="{{ field.value }}"{% endif %} {% for key, value in field.field.widget.attrs.items %}{% if value == True %}{{ key }} {% else %}{{ key }}="{{ value }}" {% endif %}{% endfor %} {% if field.field.required %}required{% endif %} />
{% endif %}
