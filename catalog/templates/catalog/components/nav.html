{# Главное меню. Пункты приходят из тега main_nav, разметка ссылки — здесь. #}
<nav class="flex flex-wrap gap-5">
    {% for item in items %}
        <a class="text-sm text-slate-500 transition hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400"
           href="{{ item.url }}">{{ item.label }}</a>
    {% endfor %}
</nav>
