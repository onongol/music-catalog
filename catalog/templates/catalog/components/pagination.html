{% if is_paginated %}
    <nav class="mt-5 flex items-center gap-4 text-sm">
        {% if page_obj.has_previous %}
            <a class="text-blue-600 hover:underline dark:text-blue-400"
               href="{% querystring page=page_obj.previous_page_number %}">назад</a>
        {% endif %}
        <span class="text-slate-500 dark:text-slate-400">Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a class="text-blue-600 hover:underline dark:text-blue-400"
               href="{% querystring page=page_obj.next_page_number %}">вперёд</a>
        {% endif %}
    </nav>
{% endif %}
