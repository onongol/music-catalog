{% comment %}
Пара ссылок «править» и «удалить»: в строке таблицы и в шапке карточки.
Подписи меняются — у трека это «номер» и «убрать».
{% endcomment %}
<a class="text-blue-600 hover:underline dark:text-blue-400"
   href="{{ edit_url }}">{{ edit_label|default:"править" }}</a>
<a class="ml-3 text-red-600 hover:underline dark:text-red-400"
   href="{{ delete_url }}">{{ delete_label|default:"удалить" }}</a>
