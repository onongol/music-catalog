{% comment %}
Плитка сводки. Часть плиток ведёт в раздел, часть просто показывает счётчик:
ссылка без href остаётся некликабельной, поэтому разметка одна на оба случая.
{% endcomment %}
<a class="flex-1 rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-800 {% if stat.url %}hover:border-blue-500 dark:hover:border-blue-400{% endif %}"
   {% if stat.url %}href="{{ stat.url }}"{% endif %}>
    <span class="block text-3xl font-bold leading-tight">{{ stat.value }}</span>
    <span class="block text-sm text-slate-500 dark:text-slate-400">{{ stat.label }}</span>
</a>
